plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mycar.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.mycar.launcher"
        minSdk 21
        targetSdk 30
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }
}
